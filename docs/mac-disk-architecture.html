  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }

    margin: 14px 0;

  .bar .avail { background:#16a34a; }
  .bar .findings { background:#ea580c; }
  .bar .rest { background:#2563eb; }
  table { width:100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; text-align:left; }
  th { color: var(--muted); font-weight: 600; background: #faf7f2; position: sticky; top: 0; }

Parent Home/Library sizes use child aggregation when direct du is blocked by TCC/timeouts.", "stat_pool": "APFS pool size", "stat_used": "Data used", "stat_avail": "Available", "stat_home": "Home (mapped)", "cap_title": "Capacity mix on the shared APFS pool", "cap_full": "full (Data UI)", "cap_used": "used", "cap_free": "free", "cap_pool": "pool", "cap_legend": "Green=available · Orange=catalog findings · Blue=other used", "cap_share": "Findings share of pool", "lib_mapped": "Library mapped", "hier_title": "Hierarchy (drilled)", "hier_path": "Data ({used} used) → ~ ({home}) → Library ({lib}) → hot subtrees", "t_lib": "~/Library (top)", "t_ct": "Library/Containers (top sandboxes)", "t_as": "Library/Application Support (top)", "t_home": "~ other heavy paths (non-Library)", "nodes": "nodes", "col_size": "Size", "col_id": "Identity / path", "col_role": "Role", "col_tier": "Tier", "col_action": "Action", "col_conf": "Conf", "col_deps": "Deps / evidence", "cat_title": "Catalog findings (semantic layer)", "cat_desc": "From scan.sh --json schema v2 — strongest evidence for tier promotion (open_now / owner_app).", "legend": "Legend", "leg_t1": "T1 regenerable", "leg_t2": "T2 confirm unused tools", "leg_t3": "T3 orphan sandbox candidate", "leg_t4": "T4 forbidden / in-use", "leg_unk": "unknown / info", "findings_title": "Enriched findings", "col_evidence": "Evidence", "lang": "Language", "open_now": "open_now", "owner": "owner", "regen_yes": "regen:yes", "regen_no": "regen:no", "conf_high": "high", "conf_medium": "medium", "conf_low": "low", "footer": "Full JSON: /tmp/apfs-spa-arch-tree.json · findings: /tmp/apfs-spa-report-v2.json"}};
const ROLE_ZH = {"sandbox_root": "沙盒根目录", "app_data_root": "应用数据根目录", "sdk": "SDK / 工具链", "cache_root": "缓存根目录", "unknown": "未知", "dev_tools": "开发工具", "ide_data": "IDE 数据", "app_data": "应用数据", "app_sandbox": "应用沙盒", "dot_tool_data": "隐藏工具数据", "user_content": "用户内容", "emulator": "模拟器", "user_home": "用户主目录", "library_root": "用户 Library"};
const ACTION_ZH = {"safe_to_clean": "可安全清理", "ask_first": "先确认", "forbidden": "禁止", "info": "信息"};
const ID_ZH = {"App Sandboxes": "应用沙盒", "Application Support": "Application Support", "Android SDK area": "Android SDK 区域", "Caches": "缓存", "Xcode/Developer": "Xcode/Developer", "Cursor IDE data": "Cursor IDE 数据", "Trae IDE data": "Trae IDE 数据", "Telegram data": "Telegram 数据", "Google app data": "Google 应用数据", "WeChat sandbox": "微信沙盒", "Documents": "文稿", "Android SDK": "Android SDK"};
const WHY_ZH = {"open_now: process holds path": "正在使用：有进程占用该路径", "no owner_app found — possible leftover sandbox": "未找到属主 App — 可能是卸载残留沙盒", "large toolchain/emulator — confirm unused": "大型工具链/模拟器 — 请确认已不用", "container without v2 enrichment in this tree pass": "本轮树扫描未做 v2 富化的容器", "catalog regenerable cache": "目录表可再生缓存", "catalog red-line path": "目录表红线路径", "owner_app installed and has use evidence": "属主 App 仍安装且有使用证据"};
const CONF_ZH = { high: "高", medium: "中", low: "低" };

function detectLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "zh" || q === "en") return q;
  const nav = (navigator.language || "en").toLowerCase();
  return nav.startsWith("zh") ? "zh" : "en";
}

function t(key) { return (I18N[lang] && I18N[lang][key]) || key; }

function Lrole(r) { return lang === "zh" ? (ROLE_ZH[r] || r || "—") : (r || "—"); }
function Laction(a) { return lang === "zh" ? (ACTION_ZH[a] || a || "—") : (a || "—"); }
function Lid(s) {
  if (!s) return "—";
  if (lang !== "zh") return s;
  if (ID_ZH[s]) return ID_ZH[s];
  if (s.startsWith("Container ")) return "容器 " + s.slice(10);
  return s;
}
function Lwhy(s) { return lang === "zh" ? (WHY_ZH[s] || s || "") : (s || ""); }
function Lconf(c) { return lang === "zh" ? (CONF_ZH[c] || c || "") : (c || ""); }
function Ldown(d) {
  if (!d) return null;
  if (lang === "zh" && d === "app user data / cache inside sandbox") return "沙盒内用户数据/缓存";
  return d;
}
function Lup(u) {
  if (!u) return null;
  if (lang === "zh" && u === "Android Studio / cmdline-tools") return "Android Studio / 命令行工具";
  return String(u).replace(/^\/Applications\//, "");
}

function pillTier(tier) {
  const cls = tier === "T4" ? "tone-t4" : tier === "T3" ? "tone-t3" : tier === "T2" ? "tone-t2" : tier === "T1" ? "tone-t1" : "";
  return `<span class="pill ${cls}">${tier}</span>`;
}
function pillAction(a) {
  const cls = a === "forbidden" ? "tone-t4" : a === "ask_first" ? "tone-t3" : a === "safe_to_clean" ? "tone-t1" : "";
  return `<span class="pill ${cls}">${Laction(a)}</span>`;
}

function depsHtml(n) {
  const bits = [];
  if (n.open_now) bits.push(t("open_now"));
  if (n.owner && n.owner !== "—") bits.push(`${t("owner")}:${String(n.owner).replace(/^\/Applications\//,"")}`);
  const up = Lup(n.up); if (up) bits.push("↑ " + up);
  const down = Ldown(n.down); if (down) bits.push("↓ " + down);
  if (n.regen === true) bits.push(t("regen_yes"));
  if (n.regen === false) bits.push(t("regen_no"));
  const why = Lwhy(n.why); if (why) bits.push(why);
  return bits.join(" · ") || "—";
}

function tableSection(titleKey, rows) {
  const body = rows.map(n => {
    const tone = n.tier === "T4" || n.action === "forbidden" ? "t4" : n.tier === "T3" ? "t3" : n.tier === "T2" ? "t2" : n.tier === "T1" ? "t1" : "";
    return `<tr>
      <td class="num">${n.human}</td>
      <td class="id"><span class="dot ${tone}"></span><div class="main">${escapeHtml(Lid(n.identity || n.label || n.name))}</div><div class="sub">${escapeHtml(n.name || "")}</div></td>
      <td>${escapeHtml(Lrole(n.role))}</td>
      <td>${pillTier(n.tier)}</td>
      <td>${pillAction(n.action)}</td>
      <td>${escapeHtml(Lconf(n.confidence))}</td>
      <td class="muted small">${escapeHtml(depsHtml(n))}</td>
    </tr>`;
  }).join("");
  return `<div class="card">
    <div class="card-h"><span>${t(titleKey)}</span><span class="small muted">${rows.length} ${t("nodes")}</span></div>
    <div style="overflow:auto">
      <table>
        <thead><tr>
          <th style="text-align:right">${t("col_size")}</th>
          <th>${t("col_id")}</th>
          <th>${t("col_role")}</th>
          <th>${t("col_tier")}</th>
          <th>${t("col_action")}</th>
          <th>${t("col_conf")}</th>
          <th>${t("col_deps")}</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

let lang = detectLang();

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.getAttribute("data-i")); });
  document.getElementById("title").textContent = t("title");
  document.getElementById("subtitle").textContent = t("subtitle");
  document.getElementById("howto_title").textContent = t("howto_title");
  document.getElementById("howto").textContent = t("howto");
  document.getElementById("source").textContent = t("source") + " " + DATA.disk.volume;

  document.getElementById("v-pool").textContent = DATA.disk.size_h;
  document.getElementById("v-used").textContent = DATA.disk.used_h;
  document.getElementById("v-avail").textContent = DATA.disk.avail_h;
  document.getElementById("v-home").textContent = DATA.home_h;

  const size = DATA.disk.size, used = DATA.disk.used, avail = DATA.disk.avail;
  const findings = 25.7 * 1024 ** 3;
  const rest = Math.max(0, used - findings);
  const pct = v => Math.max(0.5, (v / size) * 100);
  document.getElementById("cap-bar").innerHTML =
    `<span class="avail" style="width:${pct(avail)}%"></span>` +
    `<span class="findings" style="width:${pct(findings)}%"></span>` +
    `<span class="rest" style="width:${pct(rest)}%"></span>`;
  document.getElementById("cap-meta").textContent =
    `${DATA.disk.capacity} ${t("cap_full")} · ${DATA.disk.used_h} ${t("cap_used")} · ${DATA.disk.avail_h} ${t("cap_free")} · ${t("cap_pool")} ${DATA.disk.size_h}`;
  document.getElementById("cap-legend").textContent =
    `${t("cap_legend")} (${DATA.disk.findings_total_h})`;
  document.getElementById("cap-share").textContent =
    `${t("cap_share")} ${((findings/size)*100).toFixed(1)}% · ${t("lib_mapped")} ${DATA.library_h}`;

  document.getElementById("hier_path").textContent = t("hier_path")
    .replace("{used}", DATA.disk.used_h).replace("{home}", DATA.home_h).replace("{lib}", DATA.library_h);

  document.getElementById("tables").innerHTML =
    tableSection("t_lib", DATA.lib) +
    tableSection("t_ct", DATA.ct) +
    tableSection("t_as", DATA.as) +
    tableSection("t_home", DATA.home_extra);

  document.getElementById("legend").innerHTML = [
    ["T1", t("leg_t1"), "tone-t1"],
    ["T2", t("leg_t2"), "tone-t2"],
    ["T3", t("leg_t3"), "tone-t3"],
    ["T4", t("leg_t4"), "tone-t4"],
    ["?", t("leg_unk"), ""],
  ].map(([k, label, cls]) => `<span class="pill ${cls}">${label}</span>`).join("");

  const fbody = DATA.findings.map(f => {
    const tone = f.tier === "T4" ? "t4" : f.tier === "T3" ? "t3" : f.tier === "T2" ? "t2" : "";
    const ev = depsHtml(f);
    return `<tr>
      <td class="num">${f.human}</td>
      <td><span class="dot ${tone}"></span>${escapeHtml(Lid(f.label))}</td>
      <td>${pillTier(f.tier)}</td>
      <td>${pillAction(f.action)}</td>
      <td>${escapeHtml(Lrole(f.role))}</td>
      <td class="muted small">${escapeHtml(ev)}</td>
    </tr>`;
  }).join("");
  document.getElementById("findings").innerHTML = `<div style="overflow:auto"><table>
    <thead><tr>
      <th style="text-align:right">${t("col_size")}</th>
      <th>${t("col_id")}</th>
      <th>${t("col_tier")}</th>
      <th>${t("col_action")}</th>
      <th>${t("col_role")}</th>
      <th>${t("col_evidence")}</th>
    </tr></thead><tbody>${fbody}</tbody></table></div>`;

  document.title = t("title") + " · apfs-spa";
  const url = new URL(location.href);
  url.searchParams.set("lang", lang);
  history.replaceState(null, "", url);
}

function setLang(l) { lang = l; render(); }
render();
</script>
